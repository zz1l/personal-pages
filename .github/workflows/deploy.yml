# Deploy to GitHub Pages
#
# On every push to `main`:
#   npm ci → npm run build → upload dist → deploy to Pages
#
# The Astro `base` and `site` are derived from the repository name, so a
# project site (https://owner.github.io/<repo>/) works with no configuration.
# For a user/org site (repo named <owner>.github.io), set ASTRO_BASE to "/"
# in the build step's env block.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          ASTRO_BASE: /${{ github.event.repository.name }}/
          ASTRO_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
